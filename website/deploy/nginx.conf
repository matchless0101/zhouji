# Installed as /etc/nginx/sites-available/zhouji-site on SSH host yj.
server {
    listen 80;
    listen [::]:80;
    server_name zhouji.xiangdangdang.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zhouji-site/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://zhouji.xiangdangdang.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zhouji.xiangdangdang.top;

    ssl_certificate /etc/letsencrypt/live/zhouji.xiangdangdang.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhouji.xiangdangdang.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/zhouji-site/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/zhouji-site.access.log;
    error_log /var/log/nginx/zhouji-site.error.log;

    add_header X-Content-Type-Options nosniff always;

    # Exact matches take precedence over the hidden-file deny rule below.
    # Apple must receive the extensionless association file without redirects.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /apple-app-site-association {
        default_type application/json;
        try_files /.well-known/apple-app-site-association =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }
}

name: ZhouJi
options:
  bundleIdPrefix: com.matchless
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7V46ZF4WY4"
targets:
  ZhouJi:
    type: application
    platform: iOS
    sources:
      - path: ZhouJi
      - path: Vendor/WechatOpenSDK-NoPay.xcframework/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - framework: Vendor/WechatOpenSDK-NoPay.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreGraphics.framework
      - sdk: WebKit.framework
      - sdk: libc++.tbd
    info:
      path: ZhouJi/Info.plist
      properties:
        ZhouJiWeChatAppID: $(ZHOUJI_WECHAT_APP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.matchless.ZhouJi.wechat
            CFBundleURLSchemes:
              - $(ZHOUJI_WECHAT_APP_ID)
        LSApplicationQueriesSchemes:
          - weixin
          - weixinULAPI
          - weixinURLParamsAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matchless.ZhouJi
        CODE_SIGN_ENTITLEMENTS: ZhouJi/ZhouJi.entitlements
        PRODUCT_NAME: ZhouJi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 粥记
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-all_load"]
    scheme:
      testTargets:
        - ZhouJiTests
        - ZhouJiUITests
  ZhouJiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZhouJiTests
    dependencies:
      - target: ZhouJi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matchless.ZhouJiTests
        GENERATE_INFOPLIST_FILE: YES
  ZhouJiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZhouJiUITests
    dependencies:
      - target: ZhouJi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matchless.ZhouJiUITests
        GENERATE_INFOPLIST_FILE: YES

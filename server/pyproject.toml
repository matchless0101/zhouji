[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhouji-api"
version = "0.1.0"
description = "粥记账户与云同步服务"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1",
  "PyMySQL[rsa]>=1.1,<2",
  "PyJWT[crypto]>=2.14,<3",
  "cryptography>=50,<51",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
